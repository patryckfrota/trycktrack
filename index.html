<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trycktrack mudou de endereço</title>
    <meta http-equiv="refresh" content="4; url=https://trycktrack.vercel.app/">
    <link rel="canonical" href="https://trycktrack.vercel.app/">
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1115; color: #e8eaed; padding: 24px; box-sizing: border-box;
        }
        @media (prefers-color-scheme: light) { body { background: #f5f6f8; color: #1a1c20; } }
        main { max-width: 420px; text-align: center; }
        h1 { font-size: 1.4rem; margin: 0 0 12px; }
        p { line-height: 1.5; opacity: .85; margin: 0 0 20px; }
        a.btn {
            display: inline-block; padding: 12px 22px; border-radius: 10px;
            background: #2f7d5b; color: #fff; text-decoration: none; font-weight: 600;
        }
        small { display: block; margin-top: 18px; opacity: .6; }
    </style>
</head>
<body>
    <main>
        <h1>O Trycktrack mudou de endereço</h1>
        <p>Agora o app fica em <strong>trycktrack.vercel.app</strong>.
           Entre com a mesma conta: seu progresso continua lá.</p>
        <a class="btn" id="ir" href="https://trycktrack.vercel.app/">Ir para o novo endereço</a>
        <small>Se instalou o app na tela inicial, instale de novo pelo endereço novo.</small>
    </main>
    <script>
        // Leva junto o caminho, a busca e o hash do link antigo.
        var resto = location.pathname.replace(/^\/trycktrack\/?/, '') + location.search + location.hash;
        var destino = 'https://trycktrack.vercel.app/' + resto;
        document.getElementById('ir').href = destino;

        // Remove o service worker e o cache da versão antiga deste endereço.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
        }
        if (window.caches) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
        }

        setTimeout(function () { location.replace(destino); }, 2500);
    </script>
</body>
</html>
