name = "trycktrack-osce-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# A chave da Groq NÃO vai aqui — nunca em arquivo versionado. Ela é
# configurada como secret depois do primeiro deploy, com:
#   wrangler secret put GROQ_API_KEY
# Ver README.md nesta pasta para o passo a passo completo.

# Rate limit de geração por usuário (checkGenerationRateLimit em
# worker.js) — sem esse binding o Worker funciona normalmente, só não
# limita ainda.
[[kv_namespaces]]
binding = "OSCE_RATE_LIMIT_KV"
id = "0b886b6a7cf74ae4bef669e3b1da55d2"
