# Backup semanal do Postgres (Supabase). O plano Free do Supabase não faz
# backup automático.
#
# O repositório é PÚBLICO e os artefatos de um repositório público podem ser
# baixados por qualquer conta do GitHub, e o banco tem e-mails de usuários.
# Por isso o dump só é publicado criptografado (AES-256), e o workflow falha
# sem a senha em vez de subir um arquivo em texto puro.
#
# Segredos necessários: DATABASE_URL e BACKUP_PASSPHRASE.
# Guarde a BACKUP_PASSPHRASE no gerenciador de senhas: sem ela o backup não abre.
#
# Restaurar (no seu computador):
#   openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out backup.dump
#   pg_restore --no-owner --dbname "<url de um banco VAZIO>" backup.dump
name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exigir os segredos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Segredo DATABASE_URL não configurado"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Segredo BACKUP_PASSPHRASE não configurado: sem ele o backup não pode ser criptografado e não será gerado"; exit 1; }

      - name: Instalar o cliente PostgreSQL 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Gerar o dump criptografado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # O pg_dump precisa de sessão: tira o ?pgbouncer=true e usa a porta 5432 do pooler.
          URL="${DATABASE_URL%%\?*}"
          URL="${URL/:6543\//:5432/}"
          /usr/lib/postgresql/17/bin/pg_dump --schema=public --no-owner --no-privileges --format=custom "$URL" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -out backup.dump.enc
          test -s backup.dump.enc
          ls -l backup.dump.enc

      - uses: actions/upload-artifact@v4
        with:
          name: backup-banco-${{ github.run_id }}
          path: backup.dump.enc
          retention-days: 35
          if-no-files-found: error
